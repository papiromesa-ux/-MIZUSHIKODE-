  <main>
    <div class="musica-container">
      
      <!-- REPRODUCTOR PRINCIPAL -->
      <div class="player-box">
        <div class="cover-art">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>

        <div class="track-info">
          <h2 id="track-title">Selecciona una canción</h2>
          <p id="track-artist">MizushiKode Radio</p>
        </div>

        <div class="player-controls">
          <button class="btn-control" id="btn-prev">
            <svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>

          <button class="btn-control" id="btn-next">

          <span id="time-current">0:00</span>
          <div class="progress-bar-bg" id="progress-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
