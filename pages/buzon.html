  <main class="section">
    <header class="page-header" style="padding-top: 2rem; padding-bottom: 1rem;">
      <h1 class="texto-3d" style="font-size: 2.5rem; margin-bottom: 0.5rem;">&lt;Buzón de&gt; QUEJAS</h1>
      <p class="section-sub" style="text-align: center; color: var(--texto-dim);">Déjanos tu reporte o sugerencia.</p>
    </header>

    <div class="buzon-box">
      <form id="formReporte">
        <label style="color: var(--cian); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Nombre del Estudiante</label>
        <input type="text" id="nombreReporte" class="input-3d" placeholder="Ej. Alexi" required>

        <label style="color: var(--cian); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Tipo de Reporte</label>
        <select id="tipoReporte" class="input-3d">
          <option value="error">Fallo en el Sistema (Bug)</option>
          <option value="sugerencia">Sugerencia o Mejora</option>
          <option value="contenido">Error en una Lección</option>
        </select>

        <label style="color: var(--cian); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Mensaje</label>
        <textarea id="mensajeReporte" class="input-3d" rows="5" placeholder="Describe el problema..." required></textarea>

        <p id="msj-error" style="display: none; color: #ff2e97; font-weight: bold; margin-bottom: 1rem; text-align: center;">Error.</p>

        <button type="button" id="btnEnviarReporte" class="btn btn-primary btn-icono" style="width: 100%; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Enviar a WhatsApp
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-logo"><span class="logo-yami">MIZUSHI</span><span class="logo-code">KODE</span></div>
    <p>PAPIROMESA-UX RELEASE 1 MIZUSHIKODE.</p>
