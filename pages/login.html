      <span></span><span></span><span></span>

      <a href="aula.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> Aulas</a>
      <a href="labs.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> Clubs</a>

      <a href="buzon.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> Buzón</a>

  <main>
    <div class="login-box-3d">
      <h2 class="texto-3d-neon" style="font-size: 2rem; text-align: center; margin-bottom: 0.5rem;" id="formTitle">Recepción</h2>
      <p style="text-align: center; color: var(--texto-dim); margin-bottom: 2rem;" id="formSub">Ingresa tus credenciales de estudiante.</p>

      <form id="authForm">
        <div id="groupName" style="display: none;">
          <label style="color: var(--cian); font-size: 0.9rem;">Nombre Completo</label>
          <input type="text" id="name" class="input-3d" placeholder="Tu nombre" minlength="3">
        </div>

        <label style="color: var(--cian); font-size: 0.9rem;">Correo Electrónico</label>
        <input type="email" id="email" class="input-3d" placeholder="ejemplo@clases.edu.sv" required>
        
        <div id="groupSchool" style="display: none;">
          <label style="color: var(--cian); font-size: 0.9rem;">Institución Educativa</label>
          <select id="schoolSelect" class="input-3d">
            <option value="">Selecciona tu colegio...</option>
            <option value="instituto_nacional_general_francisco_menendez">Instituto Nacional General Francisco Menéndez</option>
            <option value="complejo_educativo_refugios_sifontes">Complejo Educativo Refugios Sifontes</option>
            <option value="instituto_nacional_ciudad_delgado">Instituto Nacional de Ciudad Delgado</option>
            <option value="centro_escolar_juana_lopez">Centro Escolar Juana López</option>
            <option value="centro_escolar_edelmira_molina">Centro Escolar Edelmira Molina</option>
            <option value="centro_escolar_complejo_educativo">Centro Escolar Complejo Educativo</option>
            <option value="centro_escolar_canton_milingo">Centro Escolar Cantón Milingo</option>
          </select>
        </div>

        <label style="color: var(--cian); font-size: 0.9rem;">Contraseña</label>
        <input type="password" id="password" class="input-3d" placeholder="••••••••" required minlength="6">
        
        <div id="groupConfirm" style="display: none;">
          <label style="color: var(--cian); font-size: 0.9rem;">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" class="input-3d" placeholder="••••••••" minlength="6">
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary btn-icono" style="width: 100%; margin-top: 1rem; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Entrar al Sistema
        </button>
      </form>

      <div id="mensaje" class="mensaje"></div>

      <div style="margin: 1.5rem 0; border-bottom: 1px solid var(--texto-dim); position: relative;">
        <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #181824; padding: 0 10px; color: var(--texto-dim); font-size: 0.8rem;">O</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button id="btnGoogle" class="btn btn-ghost btn-icono" style="justify-content: center; width: 100%; background: #fff; color: #333;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
          Continuar con Google
        </button>
        <button id="btnGithub" class="btn btn-ghost btn-icono" style="justify-content: center; width: 100%; background: #24292e; color: #fff; border-color: #444;">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          Continuar con GitHub
        </button>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--texto-dim); font-size: 0.9rem;" id="toggleTextContainer">
        ¿No tienes cuenta? <span id="toggleMode" style="color: var(--cian); cursor: pointer; font-weight: bold;">Regístrate aquí</span>
      </p>
    </div>
  </main>

  <script src="../js/cerebro.js"></script>
  <script type="module" src="../js/sys_login.js"></script>
</body>
</html>
